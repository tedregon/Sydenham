<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tube Timer — Night Board</title>
    <meta name="theme-color" content="#070708">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
<script defer data-domain="sydenham-station.tiiny.site" src="https://analytics.tiiny.site/js/plausible.js"></script></head>
<body>
    <main class="app">
        <header class="header">
            <div>
                <h1 class="station">Sydenham Station</h1>
                <p class="subtitle">Departures</p>
            </div>
            <p class="live-time" id="live-time"></p>
        </header>
        <div id="status" class="status" hidden></div>
        <div class="boards" aria-live="polite">
            <section class="board" aria-label="Platform 1">
                <header class="board-head">
                    <span>Platform 1</span>
                    <span class="board-head-meta">min · to</span>
                </header>
                <div class="board-rows" data-trains="1"></div>
            </section>
            <section class="board" aria-label="Platform 2">
                <header class="board-head">
                    <span>Platform 2</span>
                    <span class="board-head-meta">min · to</span>
                </header>
                <div class="board-rows" data-trains="2"></div>
            </section>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
