<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tube Timer</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Sydenham">
    <meta name="theme-color" content="#111111">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111111;
            --overground: #ffa748;
            --southern: #26907f;
            --axis-inset: clamp(16px, 3.25vw, 80px);
            --label-size: clamp(14px, 1.7vw, 22px);
            --pill-size: clamp(28px, 5.3vw, 68px);
            --pill-pad-x: clamp(4px, 0.8vw, 10px);
            --pill-pad-y: clamp(2px, 0.3vw, 4px);
            --pill-radius: clamp(4px, 0.6vw, 8px);
            --stem-height: clamp(10px, 1.25vw, 16px);
            --stem-dot: clamp(10px, 1.25vw, 16px);
            --track-pad: calc(var(--pill-size) * 2 + var(--stem-height) + 24px);
            --time-window: 45;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: "IBM Plex Mono", monospace;
            background: var(--bg);
            color: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .app {
            min-height: 100vh;
            min-height: 100dvh;
            padding: clamp(24px, 0vw, 120px) var(--axis-inset) clamp(32px, 0vw, 80px);
            display: flex;
            flex-direction: column;
            gap: clamp(24px, 4vw, 72px);
        }

        .status {
            margin: 0;
            font-size: var(--label-size);
            opacity: 0.7;
        }

        .status.error {
            color: #ff6b6b;
            opacity: 1;
        }

        .timelines {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            gap: clamp(40px, 4vw, 96px);
            min-height: 0;
        }

        .platform {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .platform-label {
            margin: calc(clamp(10px, 1.15vw, 15px) / 2 + 14px) 0 0;
            font-size: var(--label-size);
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
            pointer-events: none;
        }

        .axis-track {
            position: relative;
            width: 100%;
            padding-top: var(--track-pad);
        }

        .axis-line {
            display: block;
            pointer-events: none;
            user-select: none;
        }

        .axis-line-h {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            transform: translateY(50%);
            width: 100%;
            height: clamp(10px, 1.15vw, 15px);
        }

        .axis-line-v {
            display: none;
        }

        .trains {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        @property --train-scale {
            syntax: "<number>";
            inherits: true;
            initial-value: 1;
        }

        .train {
            position: absolute;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transform: translateX(-50%);
            pointer-events: auto;
            opacity: 1;
            transition:
                left 0.85s cubic-bezier(0.33, 1, 0.68, 1),
                top 0.85s cubic-bezier(0.33, 1, 0.68, 1),
                --train-scale 0.85s cubic-bezier(0.33, 1, 0.68, 1),
                opacity 0.35s ease;
        }

        .train.is-leaving {
            opacity: 0;
            pointer-events: none;
        }

        .trains.is-measuring .train {
            transition: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .train {
                transition: none;
            }
        }

        .train-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .train-minutes {
            margin: 0;
            font-size: calc(var(--pill-size) * var(--train-scale, 1));
            font-weight: 500;
            line-height: 1;
            text-align: center;
            color: #ffffff;
            white-space: nowrap;
        }

        .train-pill {
            margin: 0;
            padding: calc(var(--pill-pad-y) * var(--train-scale, 1)) calc(var(--pill-pad-x) * var(--train-scale, 1));
            border-radius: calc(var(--pill-radius) * var(--train-scale, 1));
            font-size: calc(var(--pill-size) * var(--train-scale, 1));
            font-weight: 500;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
        }

        .train[data-operator="overground"] .train-pill {
            background: var(--overground);
            color: #000000;
        }

        .train[data-operator="southern"] .train-pill {
            background: var(--southern);
            color: #ffffff;
        }

        .train-stem {
            width: 1.5px;
            height: var(--stem-height);
            background: #ffffff;
            position: relative;
            flex-shrink: 0;
        }

        .train-stem::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 100%;
            width: var(--stem-dot);
            height: var(--stem-dot);
            border-radius: 50%;
            background: #ffffff;
            transform: translate(-50%, -50%);
        }

        @media (orientation: portrait) {
            :root {
                --pill-size: clamp(22px, 10vw, 80px);
                --label-size: clamp(16px, 4vw, 22px);
                --axis-inset: 48px;
                --stem-height: clamp(12px, 3vw, 20px);
                --stem-dot: clamp(10px, 2.5vw, 14px);
                --track-pad: 0;
            }

            .app {
                padding: 24px;
                gap: 32px;
            }

            .timelines {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 48px;
                align-items: stretch;
                justify-content: stretch;
            }

            .platform {
                position: relative;
                height: 100%;
                min-height: 0;
            }

            .axis-track {
                flex: 1;
                min-height: 0;
                padding: 0;
                position: relative;
                z-index: 1;
            }

            .platform[data-platform="1"] .axis-track {
                /* Axis on the right (center); pills on the outer left */
            }

            .platform[data-platform="2"] .axis-track {
                /* Axis on the left (center); pills on the outer right */
            }

            .axis-line-h {
                display: none;
            }

            .axis-line-v {
                display: block;
                position: absolute;
                top: 0;
                bottom: 0;
                width: clamp(10px, 2.5vw, 15px);
                height: 100%;
                z-index: 1;
            }

            .platform[data-platform="1"] .axis-line-v {
                right: 0;
                left: auto;
                transform: translateX(50%);
            }

            .platform[data-platform="2"] .axis-line-v {
                left: 0;
                transform: translateX(-50%);
            }

            .platform-label {
                position: absolute;
                left: 0;
                right: 0;
                top: auto;
                bottom: 0;
                margin: 0;
                text-align: center;
                z-index: 0;
            }

            .trains {
                z-index: 2;
            }

            .train {
                bottom: auto;
                gap: 0;
                z-index: 2;
            }

            .train-info {
                flex-direction: row;
                align-items: center;
                gap: 6px;
            }

            .platform[data-platform="1"] .train {
                left: auto;
                right: 0;
                flex-direction: row;
                transform: translateY(-50%);
            }

            .platform[data-platform="1"] .train-info {
                flex-direction: row;
            }

            .platform[data-platform="2"] .train {
                left: 0;
                right: auto;
                flex-direction: row-reverse;
                transform: translateY(-50%);
            }

            .platform[data-platform="2"] .train-info {
                flex-direction: row-reverse;
            }

            .train-stem {
                width: var(--stem-height);
                height: 1.5px;
            }

            .platform[data-platform="1"] .train-stem::after {
                left: 100%;
                top: 50%;
                transform: translate(-50%, -50%);
            }

            .platform[data-platform="2"] .train-stem::after {
                left: 0;
                top: 50%;
                transform: translate(-50%, -50%);
            }
        }
    </style>
<script defer data-domain="sydenham-station.tiiny.site" src="https://analytics.tiiny.site/js/plausible.js"></script></head>
<body>
    <main class="app">
        <div id="status" class="status" hidden></div>
        <div class="timelines" id="timelines" aria-live="polite">
            <section class="platform" data-platform="1" aria-label="Platform 1">
                <div class="axis-track">
                    <div class="trains" data-trains="1"></div>
                    <img class="axis-line axis-line-h" src="axis-p1.svg" alt="" aria-hidden="true">
                    <img class="axis-line axis-line-v" src="axis-up.svg" alt="" aria-hidden="true">
                </div>
                <div class="platform-label">Platform 1</div>
            </section>
            <section class="platform" data-platform="2" aria-label="Platform 2">
                <div class="axis-track">
                    <div class="trains" data-trains="2"></div>
                    <img class="axis-line axis-line-h" src="axis-p2.svg" alt="" aria-hidden="true">
                    <img class="axis-line axis-line-v" src="axis-up.svg" alt="" aria-hidden="true">
                </div>
                <div class="platform-label">Platform 2</div>
            </section>
        </div>
    </main>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js', { scope: './' })
                    .then(() => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        const statusEl = document.getElementById('status');
        const TIME_WINDOW_MIN = 45;
        const TIME_WINDOW_MIN_VISIBLE = 2;
        // Keep the nearest train clear of the axis arrowhead.
        const AXIS_NEAR_INSET = 3;
        const COLLISION_GAP_PX = 4;
        const INTRO_STAGGER_MS = 120;
        const INTRO_DURATION_MS = 780;
        const TFL_ARRIVALS_URL = 'https://api.tfl.gov.uk/StopPoint/910GSYDENHM/Arrivals?lineId=windrush';
        const NATIONAL_RAIL_URL = 'https://national-rail-api.davwheat.dev/departures/SYD/20';
        const portraitQuery = window.matchMedia('(orientation: portrait)');
        const reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

        let latestDepartures = [];
        let allowMotion = true;
        let introPlayed = false;
        let introLockUntil = 0;

        async function fetchDepartures() {
            const [overgroundResult, southernResult] = await Promise.allSettled([
                fetchOvergroundDepartures(),
                fetchSouthernDepartures()
            ]);

            const overground = overgroundResult.status === 'fulfilled' ? overgroundResult.value : [];
            const southern = southernResult.status === 'fulfilled' ? southernResult.value : [];

            if (overgroundResult.status === 'rejected' && southernResult.status === 'rejected') {
                setStatus('Error fetching departure data. Please try again later.', true);
                latestDepartures = [];
                renderTrains([]);
                return;
            }

            setStatus('');
            latestDepartures = [...overground, ...southern];
            renderTrains(latestDepartures);
        }

        async function fetchOvergroundDepartures() {
            const response = await fetch(TFL_ARRIVALS_URL);
            if (!response.ok) {
                throw new Error('TfL response was not ok');
            }

            const data = await response.json();
            return data
                .filter(departure => (departure.lineId || '').toLowerCase() === 'windrush')
                .map(departure => ({
                    id: `og-${departure.vehicleId || departure.id || [
                        departure.destinationName,
                        departure.platformName,
                        departure.expectedArrival
                    ].join('|')}`,
                    operator: 'overground',
                    platform: parsePlatform(departure.platformName),
                    destination: cleanDestination(departure.destinationName),
                    expectedArrival: new Date(departure.expectedArrival),
                    cancelled: false
                }));
        }

        async function fetchSouthernDepartures() {
            const response = await fetch(NATIONAL_RAIL_URL);
            if (!response.ok) {
                throw new Error('National Rail response was not ok');
            }

            const data = await response.json();
            const services = data.trainServices || [];

            return services
                .filter(service => service.operatorCode === 'SN')
                .map(service => {
                    const cancelled = Boolean(service.isCancelled) || service.etd === 'Cancelled';
                    const expectedArrival = cancelled ? null : parseBoardTime(service.etd, service.std);
                    const destination = cleanDestination(service.destination?.[0]?.locationName);

                    return {
                        id: `sn-${service.serviceId || service.rid || [
                            service.std,
                            destination,
                            service.platform
                        ].join('|')}`,
                        operator: 'southern',
                        platform: parsePlatform(service.platform),
                        destination,
                        expectedArrival,
                        cancelled,
                        delayed: service.etd === 'Delayed'
                    };
                })
                .filter(service => service.destination);
        }

        function isPortrait() {
            return portraitQuery.matches;
        }

        function prefersReducedMotion() {
            return reduceMotionQuery.matches;
        }

        function trainId(departure) {
            return departure.id;
        }

        function renderTrains(departures, { animate = true } = {}) {
            if (animate && Date.now() < introLockUntil) return;

            const now = Date.now();
            const portrait = isPortrait();
            const shouldAnimate = animate && allowMotion && !prefersReducedMotion();
            const visible = departures
                .filter(d => !d.cancelled && d.expectedArrival && (d.platform === '1' || d.platform === '2'))
                .map(d => {
                    const minutes = Math.max(0, Math.floor((d.expectedArrival.getTime() - now) / 60000));
                    return { ...d, minutes };
                })
                .filter(d => d.minutes >= TIME_WINDOW_MIN_VISIBLE && d.minutes <= TIME_WINDOW_MIN)
                .sort((a, b) => a.minutes - b.minutes);

            const playIntro = !introPlayed && shouldAnimate && visible.length > 0;
            const introOrder = playIntro
                ? new Map(visible.map((d, index) => [trainId(d), index]))
                : null;
            let longestIntroMs = 0;

            for (const platform of ['1', '2']) {
                const el = document.querySelector(`[data-trains="${platform}"]`);
                if (!el) continue;

                const platformTrains = visible.filter(d => d.platform === platform);
                const introMs = reconcilePlatformTrains(
                    el,
                    platformTrains,
                    platform,
                    portrait,
                    shouldAnimate,
                    playIntro,
                    introOrder
                );
                longestIntroMs = Math.max(longestIntroMs, introMs);
            }

            if (playIntro) {
                introPlayed = true;
                introLockUntil = Date.now() + longestIntroMs + 80;
            }
        }

        function reconcilePlatformTrains(container, departures, platform, portrait, animate, intro, introOrder) {
            const existing = new Map(
                Array.from(container.querySelectorAll('.train:not(.is-leaving)'))
                    .map(node => [node.dataset.trainId, node])
            );
            const nextIds = new Set(departures.map(trainId));
            const orderedNodes = [];

            for (const [id, node] of existing) {
                if (!nextIds.has(id)) {
                    leaveTrain(node);
                }
            }

            for (const departure of departures) {
                const id = trainId(departure);
                let node = existing.get(id);
                let isNew = false;

                if (!node) {
                    node = createTrainElement(departure, portrait);
                    isNew = Boolean(animate);
                } else {
                    updateTrainContent(node, departure);
                }

                container.appendChild(node);
                orderedNodes.push({ node, departure, isNew });
            }

            return applyTrainPositions(
                container,
                orderedNodes,
                platform,
                portrait,
                animate,
                intro,
                introOrder
            );
        }

        function createTrainElement(departure, portrait) {
            const node = document.createElement('article');
            node.className = 'train';
            node.dataset.trainId = trainId(departure);
            node.dataset.operator = departure.operator;
            node.innerHTML = `
                <div class="train-info">
                    <p class="train-minutes"></p>
                    <p class="train-pill"></p>
                </div>
                <div class="train-stem" aria-hidden="true"></div>
            `;
            updateTrainContent(node, departure);
            setTrainPosition(node, departure.minutes, departure.platform, portrait);
            return node;
        }

        function updateTrainContent(node, departure) {
            const minutesEl = node.querySelector('.train-minutes');
            const pillEl = node.querySelector('.train-pill');
            const initials = destinationInitials(departure.destination);
            const title = `${departure.destination} · ${departure.minutes} min · ${departure.operator}`;

            node.dataset.minutes = String(departure.minutes);
            node.dataset.operator = departure.operator;
            node.style.setProperty('--train-scale', String(trainScale(departure.minutes)));
            node.title = title;
            if (minutesEl) minutesEl.textContent = String(departure.minutes);
            if (pillEl) pillEl.textContent = initials;
        }

        function setTrainPosition(node, minutes, platform, portrait) {
            const pos = positionPercent(minutes, platform, portrait);
            if (portrait) {
                node.style.left = '';
                node.style.top = `${pos}%`;
            } else {
                node.style.top = '';
                node.style.left = `${pos}%`;
            }
        }

        function leaveTrain(node) {
            if (node.classList.contains('is-leaving')) return;
            node.classList.add('is-leaving');
            const remove = () => {
                if (node.isConnected) node.remove();
            };
            if (prefersReducedMotion()) {
                remove();
                return;
            }
            const onEnd = (event) => {
                if (event.propertyName !== 'opacity') return;
                node.removeEventListener('transitionend', onEnd);
                remove();
            };
            node.addEventListener('transitionend', onEnd);
            window.setTimeout(remove, 400);
        }

        function setEnterStartPosition(node, platform, portrait) {
            if (portrait) {
                // Slide in from the far end of the vertical axis.
                const start = positionPercent(TIME_WINDOW_MIN, platform, true);
                node.style.left = '';
                node.style.top = `${start}%`;
                return;
            }

            // Landscape: every train enters left → right into its slot.
            node.style.top = '';
            node.style.left = '-8%';
        }

        function clearEnterTransition(node) {
            node.style.transitionDuration = '';
            node.style.transitionDelay = '';
        }

        function applyTrainPositions(container, orderedNodes, platform, portrait, animate, intro, introOrder) {
            if (!orderedNodes.length) return 0;

            const snapshots = animate && !intro
                ? orderedNodes.map(({ node, isNew }) => (
                    isNew
                        ? null
                        : {
                            left: node.style.left,
                            top: node.style.top
                        }
                ))
                : null;

            container.classList.add('is-measuring');

            for (const { node, departure } of orderedNodes) {
                setTrainPosition(node, departure.minutes, platform, portrait);
            }

            resolveCollisions(container, platform, portrait);
            void container.offsetWidth;

            const targets = orderedNodes.map(({ node }) => ({
                left: node.style.left,
                top: node.style.top
            }));

            if (intro) {
                for (const { node } of orderedNodes) {
                    setEnterStartPosition(node, platform, portrait);
                    node.style.opacity = '0';
                    clearEnterTransition(node);
                }
                void container.offsetWidth;
                container.classList.remove('is-measuring');

                let maxDelay = 0;
                orderedNodes.forEach(({ node, departure }, index) => {
                    const staggerIndex = introOrder?.get(trainId(departure)) ?? index;
                    const delay = staggerIndex * INTRO_STAGGER_MS;
                    maxDelay = Math.max(maxDelay, delay);
                    node.style.transitionDuration = `${INTRO_DURATION_MS}ms`;
                    node.style.transitionDelay = `${delay}ms`;
                    node.style.left = targets[index].left;
                    node.style.top = targets[index].top;
                    node.style.opacity = '1';
                });

                const totalMs = maxDelay + INTRO_DURATION_MS;
                window.setTimeout(() => {
                    orderedNodes.forEach(({ node }) => clearEnterTransition(node));
                }, totalMs + 40);

                return totalMs;
            }

            if (!animate) {
                container.classList.remove('is-measuring');
                return 0;
            }

            const hasEntering = orderedNodes.some(({ isNew }) => isNew);

            orderedNodes.forEach(({ node, isNew }, index) => {
                clearEnterTransition(node);
                if (isNew) {
                    setEnterStartPosition(node, platform, portrait);
                    node.style.opacity = '0';
                } else if (snapshots?.[index]) {
                    node.style.left = snapshots[index].left;
                    node.style.top = snapshots[index].top;
                }
            });
            void container.offsetWidth;
            container.classList.remove('is-measuring');

            let enterIndex = 0;
            let maxEnterDelay = 0;
            orderedNodes.forEach(({ node, isNew }, index) => {
                if (isNew) {
                    const delay = enterIndex * INTRO_STAGGER_MS;
                    maxEnterDelay = Math.max(maxEnterDelay, delay);
                    enterIndex += 1;
                    node.style.transitionDuration = `${INTRO_DURATION_MS}ms`;
                    node.style.transitionDelay = `${delay}ms`;
                }
                node.style.left = targets[index].left;
                node.style.top = targets[index].top;
                if (isNew) node.style.opacity = '1';
            });

            if (hasEntering) {
                window.setTimeout(() => {
                    orderedNodes.forEach(({ node, isNew }) => {
                        if (isNew) clearEnterTransition(node);
                    });
                }, maxEnterDelay + INTRO_DURATION_MS + 40);
            }

            return 0;
        }

        // 50% at 45 min → 100% at nearest visible minute
        function trainScale(minutes) {
            const span = TIME_WINDOW_MIN - TIME_WINDOW_MIN_VISIBLE;
            const clamped = Math.max(
                TIME_WINDOW_MIN_VISIBLE,
                Math.min(TIME_WINDOW_MIN, minutes)
            );
            return 1 - 0.5 * ((clamped - TIME_WINDOW_MIN_VISIBLE) / span);
        }

        function positionPercent(minutes, platform, portrait) {
            const span = TIME_WINDOW_MIN - TIME_WINDOW_MIN_VISIBLE;
            const clamped = Math.max(
                TIME_WINDOW_MIN_VISIBLE,
                Math.min(TIME_WINDOW_MIN, minutes)
            );
            const t = (clamped - TIME_WINDOW_MIN_VISIBLE) / span;
            // t=0 at the arrow (near); leave a gap so the stem doesn't cover it.
            const near = AXIS_NEAR_INSET;
            const far = 100;
            const along = near + t * (far - near);

            if (portrait) {
                // Both platforms: nearest at top (below arrow), 45 at bottom.
                return along;
            }

            // Landscape: nearest at right (left of arrow), 45 at left.
            return 100 - along;
        }

        // When two train markers overlap, push the later arrival further from "now"
        // along the timeline so pills and minute labels stay readable.
        function resolveCollisions(container, platform, portrait) {
            const trains = Array.from(container.querySelectorAll('.train:not(.is-leaving)'));
            if (trains.length < 2) return;

            const containerRect = container.getBoundingClientRect();
            const axisSize = portrait ? containerRect.height : containerRect.width;
            if (axisSize <= 0) return;

            const prop = portrait ? 'top' : 'left';
            // +1 means increasing the CSS % moves further from "now".
            // Portrait: 0 at top → push later trains down (+top).
            // Landscape: 0 at right → push later trains left (−left).
            const awaySign = portrait ? 1 : -1;

            for (let i = 1; i < trains.length; i++) {
                const prevRect = trains[i - 1].getBoundingClientRect();
                const curr = trains[i];
                const currRect = curr.getBoundingClientRect();

                if (!rectsOverlap(prevRect, currRect, COLLISION_GAP_PX)) continue;

                const overlapPx = portrait
                    ? (awaySign > 0
                        ? prevRect.bottom + COLLISION_GAP_PX - currRect.top
                        : currRect.bottom + COLLISION_GAP_PX - prevRect.top)
                    : (awaySign > 0
                        ? prevRect.right + COLLISION_GAP_PX - currRect.left
                        : currRect.right + COLLISION_GAP_PX - prevRect.left);

                if (overlapPx <= 0) continue;

                const current = parseFloat(curr.style[prop]) || 0;
                const next = current + awaySign * (overlapPx / axisSize) * 100;
                curr.style[prop] = `${next}%`;
            }
        }

        function rectsOverlap(a, b, gap = 0) {
            return !(
                a.right + gap <= b.left ||
                a.left >= b.right + gap ||
                a.bottom + gap <= b.top ||
                a.top >= b.bottom + gap
            );
        }

        function destinationInitials(name) {
            const skip = new Set(['and', 'the', '&', 'via', 'rail', 'station']);
            const words = String(name)
                .split(/[\s\-/]+/)
                .map(w => w.replace(/[^A-Za-z]/g, ''))
                .filter(w => w && !skip.has(w.toLowerCase()));

            if (words.length === 0) return '??';
            if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
            return (words[0][0] + words[1][0]).toUpperCase();
        }

        function parsePlatform(platform) {
            if (platform === null || platform === undefined || platform === '') {
                return null;
            }

            const match = String(platform).match(/(\d+)/);
            if (!match) return null;
            if (match[1] === '1' || match[1] === '2') return match[1];
            return null;
        }

        function parseBoardTime(etd, std) {
            const time = etd && /^\d{2}:\d{2}$/.test(etd) ? etd : std;
            if (!time || !/^\d{2}:\d{2}$/.test(time)) {
                return null;
            }

            const [hours, minutes] = time.split(':').map(Number);
            const expected = new Date();
            expected.setSeconds(0, 0);
            expected.setHours(hours, minutes, 0, 0);

            // After midnight, board times near 00:xx should roll to the next day.
            const now = new Date();
            if (expected.getTime() < now.getTime() - 30 * 60000) {
                expected.setDate(expected.getDate() + 1);
            }

            return expected;
        }

        function cleanDestination(name) {
            if (!name) return '';
            return name.replace(/\s+Rail Station$/i, '');
        }

        function setStatus(message, isError = false) {
            if (!message) {
                statusEl.hidden = true;
                statusEl.textContent = '';
                statusEl.classList.remove('error');
                return;
            }
            statusEl.hidden = false;
            statusEl.textContent = message;
            statusEl.classList.toggle('error', isError);
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/'/g, '&#39;');
        }

        function onOrientationChange() {
            allowMotion = false;
            renderTrains(latestDepartures, { animate: false });
            window.requestAnimationFrame(() => {
                allowMotion = true;
            });
        }

        let resizeTimer = 0;
        function onViewportChange() {
            window.clearTimeout(resizeTimer);
            resizeTimer = window.setTimeout(() => {
                renderTrains(latestDepartures, { animate: false });
            }, 100);
        }

        if (typeof portraitQuery.addEventListener === 'function') {
            portraitQuery.addEventListener('change', onOrientationChange);
        } else if (typeof portraitQuery.addListener === 'function') {
            portraitQuery.addListener(onOrientationChange);
        }

        window.addEventListener('resize', onViewportChange);

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                if (latestDepartures.length) {
                    renderTrains(latestDepartures, { animate: false });
                }
            });
        }

        fetchDepartures();
        setInterval(fetchDepartures, 60000);
    </script>
</body>
</html>
