<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tube Timer</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Sydenham">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Barlow Condensed", sans-serif;
            font-size: 16px;
            font-weight: 400;
            margin: 20px;
            color: orange;
            background-color: #272727;
        }
        h3 {
            width: 100%;
            text-align: center;
        }
        .departure {
            padding: 10px 0;
            border-bottom: 1px solid #444444;
            width: 340px;
            height: 16px;
            text-align: left;
            overflow: hidden;
        }
        .platform {
            width: 28px;
            display: inline-block;
            color: #ffffff;
            float: left;
            position: relative;
            white-space: nowrap;
        }
        .time {
            width: 48px;
            display: inline-block;
            color: #ffffff;
            float: left;
            position: relative;
            white-space: nowrap;
        }
        .destination {
            max-width: 240px;
            display: inline-block;
            float: left;
            text-overflow: ellipsis;
            overflow: hidden;
            position: relative;
            white-space: nowrap;
        }
        .empty, .error {
            margin: 8px 0;
        }
        .error {
            color: red;
            text-align: center;
        }
    </style>
<script defer data-domain="sydenham-station.tiiny.site" src="https://analytics.tiiny.site/js/plausible.js"></script></head>
<body style="max-width: 100%; margin: 0 auto; padding: 0 20px;">
    <h3>Sydenham Station</h3>
    <div id="departures">Loading...</div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js', { scope: './' })
                    .then(() => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        const departuresContainer = document.getElementById('departures');
        const TFL_ARRIVALS_URL = 'https://api.tfl.gov.uk/StopPoint/910GSYDENHM/Arrivals?lineId=windrush';
        const NATIONAL_RAIL_URL = 'https://national-rail-api.davwheat.dev/departures/SYD/20';

        async function fetchDepartures() {
            const [overgroundResult, southernResult] = await Promise.allSettled([
                fetchOvergroundDepartures(),
                fetchSouthernDepartures()
            ]);

            const overground = overgroundResult.status === 'fulfilled' ? overgroundResult.value : [];
            const southern = southernResult.status === 'fulfilled' ? southernResult.value : [];

            if (overgroundResult.status === 'rejected' && southernResult.status === 'rejected') {
                departuresContainer.innerHTML = `<p class="error">Error fetching departure data. Please try again later.</p>`;
                return;
            }

            displayDepartures([...overground, ...southern]);
        }

        async function fetchOvergroundDepartures() {
            const response = await fetch(TFL_ARRIVALS_URL);
            if (!response.ok) {
                throw new Error('TfL response was not ok');
            }

            const data = await response.json();
            return data
                .filter(departure => (departure.lineId || '').toLowerCase() === 'windrush')
                .map(departure => ({
                    platform: formatPlatform(departure.platformName),
                    destination: cleanDestination(departure.destinationName),
                    expectedArrival: new Date(departure.expectedArrival),
                    cancelled: false
                }));
        }

        async function fetchSouthernDepartures() {
            const response = await fetch(NATIONAL_RAIL_URL);
            if (!response.ok) {
                throw new Error('National Rail response was not ok');
            }

            const data = await response.json();
            const services = data.trainServices || [];

            return services
                .filter(service => service.operatorCode === 'SN')
                .map(service => {
                    const cancelled = Boolean(service.isCancelled) || service.etd === 'Cancelled';
                    const expectedArrival = cancelled ? null : parseBoardTime(service.etd, service.std);

                    return {
                        platform: formatPlatform(service.platform),
                        destination: cleanDestination(service.destination?.[0]?.locationName),
                        expectedArrival,
                        cancelled,
                        delayed: service.etd === 'Delayed'
                    };
                })
                .filter(service => service.destination);
        }

        function displayDepartures(departures) {
            if (departures.length === 0) {
                departuresContainer.innerHTML = '<p class="empty">No departures.</p>';
                return;
            }

            const sorted = departures.slice().sort((a, b) => {
                if (a.cancelled && !b.cancelled) return 1;
                if (!a.cancelled && b.cancelled) return -1;
                if (!a.expectedArrival) return 1;
                if (!b.expectedArrival) return -1;
                return a.expectedArrival - b.expectedArrival;
            });

            departuresContainer.innerHTML = sorted.map(departure => {
                const timeLeft = formatTimeLeft(departure);
                return `<div class="departure">
                            <div class="platform">${departure.platform}</div>
                            <div class="time">${timeLeft}</div>
                            <div class="destination">${departure.destination}</div>
                        </div>`;
            }).join('');
        }

        function formatPlatform(platform) {
            if (platform === null || platform === undefined || platform === '') {
                return '—';
            }

            const match = String(platform).match(/(\d+)/);
            if (!match) return '—';

            if (match[1] === '1') return '→';
            if (match[1] === '2') return '←';
            return '—';
        }

        function formatTimeLeft(departure) {
            if (departure.cancelled) return 'Cancelled';
            if (departure.delayed && !departure.expectedArrival) return 'Delayed';
            if (!departure.expectedArrival) return '—';

            const diffMin = Math.floor((departure.expectedArrival - new Date()) / 60000);
            if (diffMin <= 0) return 'Due';
            return `${diffMin} min`;
        }

        function parseBoardTime(etd, std) {
            const time = etd && /^\d{2}:\d{2}$/.test(etd) ? etd : std;
            if (!time || !/^\d{2}:\d{2}$/.test(time)) {
                return null;
            }

            const [hours, minutes] = time.split(':').map(Number);
            const expected = new Date();
            expected.setSeconds(0, 0);
            expected.setHours(hours, minutes, 0, 0);

            // After midnight, board times near 00:xx should roll to the next day.
            const now = new Date();
            if (expected.getTime() < now.getTime() - 30 * 60000) {
                expected.setDate(expected.getDate() + 1);
            }

            return expected;
        }

        function cleanDestination(name) {
            if (!name) return '';
            return name.replace(/\s+Rail Station$/i, '');
        }

        fetchDepartures();
        setInterval(fetchDepartures, 60000);
    </script>
</body>
</html>
